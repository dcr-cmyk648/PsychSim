name: Verify and deploy Pages

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit and content tests
        run: pnpm test

      - name: Validate approved content
        run: pnpm content:validate

      - name: Validate source boundaries
        run: pnpm content:sources:validate

      - name: Compile Developer review content
        run: pnpm content:compile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Run mobile Reviewer browser test
        run: pnpm test:e2e:reviewer

      - name: Build approved Player application
        run: pnpm build

      - name: Build portable Reviewer application
        run: pnpm build:reviewer

  package-pages:
    if: ${{ github.ref == 'refs/heads/main' && (github.event.repository.private == false || vars.PSYCHSIM_ENABLE_PAGES == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build portable Reviewer application
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build:reviewer

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && (github.event.repository.private == false || vars.PSYCHSIM_ENABLE_PAGES == 'true') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: package-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
